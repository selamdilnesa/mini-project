<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign in page</title>
    <link rel="stylesheet" href="assets/style/signinstyle.css"
</head>
<body>
    <div class="sign-in wrapper">
      <div image-container>
        <img src="assets/images/signin.png" alt="signin ">
      </div>
    <div class="form container">
        <form>
           <h2 class="signin-title">Sign in</h2>
            <div class="input-box">
                <label for="email">Email</label>
                <div class="input-field">
                    <input type="email" id="password"name="email" placeholder="Email">
                </div>
            </div>
            <div class="input-box">
                <label for="password">Password</label>
                <div class="input-field">
                    <input type="password" id="password" name="password" placeholder="password">
                </div>
            </div>
           <div class="check-box">
              <input type="checkbox" id="rememberme">
              <label for="remeberme">Remember me</label>
           </div>
           <div button-box>
             <button type="button" onclick="window.location.href='index.html'">Sign in</button>
           </div>
           <div class="forgot-password">
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <div class="signup-link">
             <p>Don't have an account? <a href="signup.html">Sign up</a></p>
          </div>
        </form>

    </div>
    </div>
    
</body>
</html>
