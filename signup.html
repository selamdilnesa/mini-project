<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dash board sign up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/style/signupstyle.css">
</head>
<body>
    <div class="signup-container">
        <div class="image-container">
            <img  src="assets/images/signup.png" alt="sign up image">
        </div>
        <div class="form-container" >
            <form>
                
                    <h1 class="signup-title">sign up</h1>
                    <div class="input-box">
                        <label for="firstname">First Name</label>
                        <div class="input-field">
                            <i class="fa fa-user"></i>
                            <input type="text" id="firstname" name="firstname" placeholder="first name">
                       </div>

                    </div>
                    <div class="input-box">
                        <label for="email">Email</label>
                        <div class="input-field">
                            <i class="fa fa-envelope"></i>
                            <input type="email"  id="email" name="email" placeholder="email">

                        </div>
                    </div>
                    <div class="input-box">
                        <label for="password">Password</label>
                        <div class="input-field">
                            <i class="fa fa-lock" ></i>
                            <input type="password" id="password" name="password" placeholder="Password">
                        </div>
                    </div>
                    <div button-box>
                        <button type="button" onclick="window.location.href='index.html'"> Create Account</button>
                    </div>
                    <div class="signin-link">
                        <p>Already have an account?<a href="signin.html">sign in</a></p>
                    </div>
                    
             </form>
        </div>
    </div>
</body>
</html>
